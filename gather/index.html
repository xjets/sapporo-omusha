<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<title>Gather · つどい</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #eef1f5; --card: #ffffff; --tint: #f6f8fa; --ink: #26303b; --soft: #66717e; --line: #dde2e8; --accent: #3f5873; --accent-2: #344a62;
    /* Each layer: a deep muted tone for text and a pastel for fills */
    --form: #45618a; --form-b: #dbe5f1; --time: #7a6a2c; --time-b: #ebe6c6; --actors: #94544e; --actors-b: #f1dbd8;
    --types: #47694b; --types-b: #d9e8da; --evidence: #5f5189; --evidence-b: #e3ddf1; --absence: #5c6570; --absence-b: #e2e5e9;
    --protocol: #3d4b57; --protocol-b: #d6dee4; --voice: #3b6f6b; --voice-b: #d3e8e5; --rec: #c2675b;
  }
  /* Hershey Simplex Pen: the 1967 Hershey vector font (public domain) built into a pen-drawn webfont for the Loop8 project.
     Latin only, one weight; Japanese falls back to Zen Maru Gothic. Add ?font=plain to compare without it. */
  @font-face { font-family: "Hershey Simplex Pen"; src: url("fonts/hershey-simplex-pen.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  body[data-font=pen] :is(header.top h1, .card > h2 > span:not(.seal), .welcome h2, .ask .q, .thanks, .stratum) {
    font-family: "Hershey Simplex Pen", "Zen Maru Gothic", sans-serif; font-weight: 400; letter-spacing: -.01em; word-spacing: -.12em; font-size: 1.18em; line-height: 1.3;
    -webkit-text-stroke: .35px currentColor; }
  html[lang=ja] body[data-font=pen] :is(header.top h1, .card > h2 > span:not(.seal), .welcome h2, .ask .q, .thanks, .stratum) { font-weight: 700; font-size: 1em; -webkit-text-stroke: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--bg); font: 15px/1.6 "Nunito", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body[data-mode=self] { font-size: 17px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 120px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  body[data-mode=self] .wrap { max-width: 680px; }
  h1, h2, h3 { font-weight: 800; letter-spacing: -.01em; }
  header.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header.top .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 180px; }
  header.top .mark { width: 40px; height: 40px; border-radius: 13px; background: var(--voice-b); color: var(--voice); display: grid; place-items: center; font: 700 20px "Zen Maru Gothic", sans-serif; flex: none; }
  header.top h1 { margin: 0; font-size: 21px; line-height: 1.2; }
  header.top p { margin: 0; color: var(--soft); font-size: 13px; line-height: 1.35; }
  .seg { display: inline-flex; background: #e2e7ed; border-radius: 12px; padding: 3px; }
  @media (max-width: 600px) { .seg { order: 3; width: 100%; } .seg button { flex: 1; } }
  .seg button { border: 0; background: transparent; box-shadow: none; min-height: 34px; padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--soft); border-radius: 10px; }
  .seg button[aria-pressed=true] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(30,45,60,.15); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: 0 1px 2px rgba(30,45,60,.04), 0 10px 28px rgba(30,45,60,.05);
    display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .card > h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  body[data-mode=self] .card > h2 { font-size: 22px; }
  .card > h2 small { font-size: 13px; font-weight: 600; color: var(--soft); }
  .seal { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; color: var(--lc, var(--accent)); background: var(--lb, #e2e7ed);
    font: 700 16px/1 "Zen Maru Gothic", sans-serif; flex: none; }
  [data-layer=form] { --lc: var(--form); --lb: var(--form-b); } [data-layer=time] { --lc: var(--time); --lb: var(--time-b); }
  [data-layer=actors] { --lc: var(--actors); --lb: var(--actors-b); } [data-layer=types] { --lc: var(--types); --lb: var(--types-b); }
  [data-layer=evidence] { --lc: var(--evidence); --lb: var(--evidence-b); } [data-layer=absence] { --lc: var(--absence); --lb: var(--absence-b); }
  [data-layer=protocol] { --lc: var(--protocol); --lb: var(--protocol-b); } [data-layer=voice] { --lc: var(--voice); --lb: var(--voice-b); }

  button, .btn { font: inherit; font-size: .95em; font-weight: 700; cursor: pointer; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; transition: background .12s, transform .08s; }
  body[data-mode=self] button { min-height: 50px; padding: 10px 18px; }
  button:hover { background: var(--tint); } button:active { transform: scale(.98); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; } button.primary:hover { background: var(--accent-2); }
  button.quiet { min-height: 34px !important; padding: 4px 11px !important; font-size: .85em; font-weight: 600; }
  button.link { all: unset; cursor: pointer; color: var(--form); text-decoration: underline; font-size: .87em; font-weight: 600; }
  button svg, .mic svg { width: 1.15em; height: 1.15em; flex: none; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--tint); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--form-b); outline-offset: 1px; border-color: var(--form); }
  textarea { resize: vertical; line-height: 1.65; }
  .f { display: grid; gap: 5px; font-size: .84em; font-weight: 600; color: var(--soft); min-width: 0; align-content: start; }
  .f > input, .f > select, .f > textarea { font-size: 1.19em; font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  body[data-mode=self] .grid { grid-template-columns: minmax(0, 1fr); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--soft); font-size: .87em; }
  .check { display: flex; gap: 10px; align-items: flex-start; background: var(--protocol-b); color: var(--protocol); border-radius: 14px; padding: 12px 14px; font-weight: 600; }
  .check input { width: 22px; height: 22px; flex: none; margin-top: 2px; accent-color: var(--accent); }
  .check.small { background: none; padding: 0; font-size: .87em; color: var(--soft); align-items: center; } .check.small input { width: 17px; height: 17px; margin: 0; }
  .hidden { display: none !important; }
  body[data-mode=self] .iv-only, body[data-mode=interviewer] .self-only { display: none !important; }
  body[data-mode=self] .step:not(.active) { display: none; }
  button.lang { padding: 5px 9px; min-height: 40px !important; } .flag { width: 28px; height: 19px; border-radius: 4px; display: none; box-shadow: 0 0 0 1px rgba(30,45,60,.2); } .flag.on { display: block; }

  /* Choice pills stand in for dropdowns in self-entry */
  .pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border-radius: 999px; font-weight: 600; font-size: 1.1em; }
  .pill[aria-pressed=true] { background: var(--lb, var(--form-b)); border-color: var(--lc, var(--form)); color: var(--lc, var(--form)); font-weight: 700; }
  body[data-mode=self] select.mirrored, body[data-mode=interviewer] .pick { display: none; }

  /* Steps (self-entry) */
  .progress { display: grid; gap: 6px; } .progress .bar { height: 8px; border-radius: 99px; background: #e0e5eb; overflow: hidden; }
  .progress .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--voice); opacity: .7; transition: width .25s; }
  .progress span { font-size: .8em; font-weight: 700; color: var(--soft); }
  .welcome h2 { font-size: 30px !important; line-height: 1.25; } .welcome p { margin: 0; }
  .how { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; } .how li { display: flex; gap: 12px; align-items: center; background: var(--tint); border-radius: 14px; padding: 10px 12px; }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 5; }
  .foot > div { max-width: 648px; margin: 0 auto; display: flex; gap: 10px; } .foot .primary { flex: 1; font-size: 1.05em; }

  /* Layer coverage */
  .cover { display: grid; grid-template-columns: repeat(auto-fit, minmax(94px, 1fr)); gap: 8px; }
  .cover div { border-radius: 14px; padding: 8px 6px; display: grid; gap: 2px; justify-items: center; text-align: center; font-size: 11.5px; color: var(--lc); background: var(--lb); }
  .cover div.empty { background: var(--tint); color: var(--soft); box-shadow: inset 0 0 0 1px var(--line); } .cover div.empty .seal { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .cover .seal { background: rgba(255,255,255,.7); } .cover b { font-size: 12px; }

  /* Voice loop */
  .ask { border-radius: 16px; background: var(--lb, var(--voice-b)); padding: 14px 16px; display: grid; gap: 8px; }
  .ask .eyebrow { font-size: .78em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--lc, var(--voice)); }
  .ask .q { font-weight: 700; font-size: 1.3em; line-height: 1.45; } .ask .muted { color: var(--lc, var(--voice)); }
  .ask button { background: rgba(255,255,255,.75); border-color: transparent; }
  .ask .mic[aria-pressed=true] { background: var(--rec); }
  .clues { display: flex; flex-wrap: wrap; gap: 7px; }
  .clue { min-height: 36px !important; padding: 4px 12px !important; border-radius: 999px; font-size: .85em; font-weight: 700; color: var(--lc); background: var(--card); border-color: var(--lb); }
  .clue.done { background: var(--lb); } .clue.done::before { content: "✓"; }
  .clue.full, .left button { width: 100%; justify-content: flex-start; text-align: left; border-radius: 14px; font-weight: 600; font-size: .95em; min-height: 44px !important; padding: 8px 14px !important; }
  .left { display: grid; gap: 6px; } .left > span { font-size: .8em; font-weight: 800; color: var(--lc, var(--voice)); }
  .mic { width: 84px; height: 84px; min-height: 84px !important; padding: 0 !important; border-radius: 50%; background: var(--voice-b); border-color: transparent; color: var(--voice); font-size: 30px; }
  .mic:hover { background: #c5dfdb; }
  .mic[aria-pressed=true] { background: var(--rec); color: #fff; animation: pulse 1.3s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(194,103,91,.18); } }
  .draft, .obs { border-radius: 16px; background: var(--tint); border: 1px solid var(--line); border-left: 6px solid var(--time-b); padding: 12px 14px; display: grid; gap: 9px; grid-template-columns: minmax(0, 1fr); }
  .draft textarea { background: var(--card); font-size: 1.05em; }
  .draft.off { opacity: .45; } .draft.absence, .obs.absence { border-left-color: var(--absence-b); border-style: dashed; border-left-style: solid; }
  .draft details summary { cursor: pointer; font-size: .85em; font-weight: 700; color: var(--soft); } .draft details .grid { margin-top: 10px; }
  .quote { font-size: .87em; color: var(--soft); border-left: 3px solid var(--line); padding-left: 10px; overflow-wrap: anywhere; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; } .chip { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: var(--lc, var(--soft)); background: var(--card); box-shadow: inset 0 0 0 1px var(--lb, var(--line)); }
  .chip.solid { background: var(--lb); box-shadow: none; }
  .stratum { font-weight: 800; font-size: .82em; color: var(--time); letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; }
  .thanks { background: var(--types-b); color: var(--types); border-radius: 16px; padding: 16px; font-weight: 700; font-size: 1.1em; }

  /* Form uploads */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .tile { border: 1.5px dashed #b9c8dc; border-radius: 16px; background: #f3f6fa; padding: 14px; display: grid; gap: 4px; cursor: pointer; transition: background .12s; }
  .tile:hover { background: var(--form-b); } .tile b { color: var(--form); } .tile input { display: none; } .tile small { color: var(--soft); font-size: .8em; }
  .basis { font-size: 11.5px; font-weight: 800; justify-self: start; padding: 1px 9px; border-radius: 999px; } .basis.recorded { color: var(--types); background: var(--types-b); } .basis.symbolic { color: var(--evidence); background: var(--evidence-b); }
  .forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .formitem { border: 1px solid var(--line); border-radius: 14px; background: var(--tint); padding: 8px; font-size: 12.5px; display: grid; gap: 4px; overflow-wrap: anywhere; }
  .formitem img { width: 100%; height: 100px; object-fit: cover; border-radius: 9px; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 14px; font-weight: 600; display: none; z-index: 9; max-width: calc(100vw - 32px); }
  .toast.on { display: block; }
</style>
</head>
<body data-mode="self">
<div class="wrap">
  <header class="top">
    <div class="brand"><a class="mark" href="/" title="Home" style="text-decoration:none">集</a><div><h1 data-t="title">Gather</h1><p data-t="subtitle"></p></div></div>
    <div class="seg" role="group"><button id="modeSelf" data-t="modeSelf">Tell it myself</button><button id="modeIv" data-t="modeIv">Interview someone</button></div>
    <a class="btn" href="view/" data-t="seeAll" style="text-decoration:none;font-size:13px;min-height:40px;padding:5px 12px">Collection</a>
    <button id="lang" class="lang" aria-label="Language / 言語">
      <svg class="flag" data-l="en" viewBox="0 0 60 30"><clipPath id="s"><path d="M0,0v30h60V0z"/></clipPath><clipPath id="q"><path d="M30,15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#s)"><path d="M0,0v30h60V0z" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#q)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></g></svg>
      <svg class="flag" data-l="ja" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#BC002D"/></svg>
    </button>
  </header>

  <div class="progress self-only" id="progress"><span id="progText"></span><div class="bar"><i id="progBar"></i></div></div>

  <!-- 0. Welcome (self-entry) -->
  <section class="card step welcome self-only" data-step="0">
    <h2 data-t="wTitle">Tell us what you know</h2>
    <p data-t="wBody"></p>
    <ul class="how">
      <li data-layer="form"><span class="seal">一</span><span data-t="w1"></span></li>
      <li data-layer="voice"><span class="seal">二</span><span data-t="w2"></span></li>
      <li data-layer="types"><span class="seal">三</span><span data-t="w3"></span></li>
      <li data-layer="protocol"><span class="seal">四</span><span data-t="w4"></span></li>
    </ul>
  </section>

  <!-- 1. Envelope -->
  <section class="card step" data-step="1" data-layer="form">
    <h2><span class="seal">形</span><span data-t="hEnvelope">The envelope</span><small data-t="hEnvelopeSub"></small></h2>
    <div class="ask self-only" id="say1"><div class="q" id="say1Q"></div>
      <div class="row" style="gap:16px"><button type="button" class="mic" id="mic1" aria-pressed="false" aria-label="Record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <div style="flex:1;min-width:0"><div id="mic1State" style="font-weight:600"></div><div class="muted" id="say1Heard"></div></div></div>
      <div class="left hidden" id="say1Left"></div>
      <div class="row"><button type="button" class="quiet" id="say1Play"><span data-t="playQ"></span></button><label class="check small"><input type="checkbox" class="autoRead"><span data-t="autoAsk"></span></label></div>
    </div>
    <div class="muted self-only" data-t="orType"></div>
    <div class="row" id="envPick"><div class="f" style="flex:1;min-width:200px"><span class="self-only" data-t="orExisting"></span><select id="envSelect"></select></div><button id="envNewBtn" class="iv-only" data-t="newEnvelope">New envelope</button></div>
    <form id="envForm" class="hidden" style="display:grid;gap:12px">
      <div class="grid">
        <label class="f"><span data-t="fName">Name</span><input id="eName" data-ph="phName"></label>
        <div class="f"><span data-t="fScale">What it is</span><select id="eScale" data-pick></select></div>
        <label class="f"><span data-t="fPlace">Town or place</span><input id="ePlace" data-ph="phPlace"></label>
        <label class="f iv-only"><span data-t="fParent">Sits inside (optional)</span><select id="eParent"></select></label>
        <label class="f iv-only"><span data-t="fAudience">Who may see it, by default</span><select id="eAudience"></select></label>
      </div>
      <div class="row iv-only"><button class="primary" data-t="create">Create</button><button type="button" id="envCancel" data-t="cancel">Cancel</button></div>
    </form>
    <div id="crumb" class="muted iv-only"></div>
    <div class="cover iv-only" id="cover"></div>
  </section>

  <div id="work" class="hidden" style="display:grid;gap:16px;grid-template-columns:minmax(0,1fr)">
  <!-- 2. Who is speaking: actors, standing, protocol -->
  <section class="card step" data-step="2" data-layer="actors">
    <h2><span class="seal">人</span><span data-t="hSession">Who is speaking</span></h2>
    <div class="ask self-only" id="say2"><div class="q" id="say2Q"></div>
      <div class="row" style="gap:16px"><button type="button" class="mic" id="mic2" aria-pressed="false" aria-label="Record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <div style="flex:1;min-width:0"><div id="mic2State" style="font-weight:600"></div><div class="muted" id="say2Heard"></div></div></div>
      <div class="left hidden" id="say2Left"></div>
      <div class="row"><button type="button" class="quiet" id="say2Play"><span data-t="playQ"></span></button><label class="check small"><input type="checkbox" class="autoRead"><span data-t="autoAsk"></span></label></div>
    </div>
    <div class="muted self-only" data-t="orType"></div>
    <div class="grid">
      <label class="f iv-only"><span data-t="fInterviewer">Your name (interviewer)</span><input id="sInterviewer"></label>
      <label class="f"><span data-t="fSpeaker">Speaker's name (or leave blank)</span><input id="sSpeaker" autocomplete="off"></label>
      <div class="f"><span data-t="fRole">Their relation to it</span><select id="sRole" data-pick></select></div>
      <label class="f iv-only"><span data-t="fGranted">Standing recognised by (optional)</span><input id="sGranted" data-ph="phGranted"></label>
      <div class="f" data-layer="protocol"><span data-t="fSessionAudience">Who may see what they say</span><select id="sAudience" data-pick></select></div>
    </div>
    <label class="check"><input type="checkbox" id="sConsent"><span data-t="consent"></span></label>
    <div class="muted" data-t="privacy"></div>
  </section>

  <!-- 3. Tell -->
  <section class="card step" data-step="3" data-layer="voice">
    <h2><span class="seal">声</span><span data-t="hTalk">Listen and ask</span></h2>
    <div class="ask" id="askBox">
      <div class="eyebrow" data-t="askNext">Ask next</div>
      <div class="q" id="askQ" data-t="askEmpty"></div>
      <div class="muted" id="askWhy"></div>
      <div class="row"><button id="askPlay" class="quiet" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span data-t="playQ">Ask aloud</span></button><button id="askNew" class="quiet" data-t="suggest">Suggest a question</button>
        <label class="check small"><input type="checkbox" id="askAuto" class="autoRead"><span data-t="autoAsk">ask aloud automatically</span></label></div>
    </div>
    <div class="f"><span data-t="cluesTitle"></span><div class="clues" id="clues"></div></div>
    <div class="row" style="align-items:center;gap:16px">
      <button class="mic" id="mic" aria-pressed="false" aria-label="Record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>

MODE = /^interview/.test(MODE || "") ? "interviewer" : "self";
const self = () => MODE === "self";
const t = (k) => (self() ? S[LANG][`${k}_self`] : undefined) ?? S[LANG][k];
const label = (v) => S[LANG].v[v] || String(v || "").replace(/-/g, " ");
const selfLabel = (v) => (self() && S[LANG].vSelf[v]) || label(v);

// ---------- State
let ENUMS = null, envelopes = [], env = null, observations = [], forms = [], drafts = [], lastQuestion = "", STEP = 0, sittingStart = new Date().toISOString();
const LAST = 6;
let got = {}, said = {}, carry = "", focus = {}, parts = { 1: [], 2: [], 3: [] }; // what has been filled by voice or by hand in this sitting
const remember = (id) => { const n = $(id); n.value = stored(`gather.${id}`) || n.value; n.addEventListener("change", () => store(`gather.${id}`, n.value)); };
const who = () => (self() ? $("sSpeaker").value : $("sInterviewer").value).trim();

function mirror(sel) { // pills that stand in for a dropdown in self-entry
  let box = sel.nextElementSibling;
  if (!box?.classList.contains("pick")) { box = el("div", "pick"); sel.after(box); sel.classList.add("mirrored"); }
  box.innerHTML = "";
  for (const o of sel.options) {
    const b = el("button", "pill", o.textContent); b.type = "button"; b.setAttribute("aria-pressed", String(o.selected));
    b.addEventListener("click", () => { sel.value = o.value; sel.dispatchEvent(new Event("change")); mirror(sel); });
    box.append(b);
  }
}
function fillSelect(sel, values, value, lab = label) {
  sel.innerHTML = "";
  for (const v of values) { const o = el("option", "", lab(v)); o.value = v; if (v === value) o.selected = true; sel.append(o); }
  if (sel.hasAttribute("data-pick")) mirror(sel);
}
const setVal = (sel, v) => { sel.value = v; if (sel.hasAttribute("data-pick")) mirror(sel); };

function applyLang() {
  document.documentElement.lang = LANG; document.body.dataset.mode = MODE;
  $("modeSelf").setAttribute("aria-pressed", String(self())); $("modeIv").setAttribute("aria-pressed", String(!self()));
  for (const f of document.querySelectorAll(".flag")) f.classList.toggle("on", f.dataset.l === LANG);
  for (const n of document.querySelectorAll("[data-t]")) if (typeof t(n.dataset.t) === "string" && !(n.id === "askQ" && lastQuestion)) n.textContent = t(n.dataset.t);
  for (const n of document.querySelectorAll("[data-ph]")) n.placeholder = t(n.dataset.ph);
  if (!ENUMS) return;
  fillSelect($("eScale"), ENUMS.scale, $("eScale").value || "keepsake");
  fillSelect($("eAudience"), ENUMS.audience, $("eAudience").value || "family");
  fillSelect($("sRole"), ENUMS.role.filter((r) => !["scholar", "curator"].includes(r)), $("sRole").value || "witness", selfLabel);
  fillSelect($("sAudience"), ENUMS.audience, $("sAudience").value || env?.audience || "family", selfLabel);
  $("envForm").classList.toggle("hidden", !self() && !$("envForm").dataset.open);
  renderEnvSelect(); renderTiles(); renderAll(); showStep();
}
$("lang").addEventListener("click", () => { LANG = LANG === "ja" ? "en" : "ja"; store("gather.lang", LANG); applyLang(); });
function setMode(m) { MODE = m; store("gather.mode", m === "self" ? "self" : "interview"); if (self()) STEP = env ? 3 : 0; $("askAuto").checked = !self(); applyLang(); }
$("modeSelf").addEventListener("click", () => setMode("self"));
$("modeIv").addEventListener("click", () => setMode("interviewer"));

// ---------- Envelope
function renderEnvSelect() {
  const sel = $("envSelect"); sel.innerHTML = "";
  const first = el("option", "", t("choose")); first.value = ""; sel.append(first);
  for (const e of envelopes) { const o = el("option", "", `${e.name} · ${label(e.scale)}${e.place ? ` · ${e.place}` : ""}`); o.value = e.id; if (env?.id === e.id) o.selected = true; sel.append(o); }
  $("envPick").classList.toggle("hidden", self() && !envelopes.length);
  const par = $("eParent"); par.innerHTML = ""; const none = el("option", "", t("none")); none.value = ""; par.append(none);
  for (const e of envelopes) { const o = el("option", "", e.name); o.value = e.id; par.append(o); }
}
async function openEnvelope(id) {
  if (!id) { env = null; $("work").classList.add("hidden"); $("cover").innerHTML = ""; $("crumb").textContent = ""; return; }
  const d = await api(`envelope?id=${encodeURIComponent(id)}`);
  env = d.envelope; observations = d.observations; forms = d.forms; drafts = []; lastQuestion = "";
  if (!self()) store("gather.env", id);
  if (!got.audience) setVal($("sAudience"), env.audience || "family");
  $("work").classList.remove("hidden");
  $("askQ").textContent = t("askEmpty"); $("askWhy").textContent = ""; $("askPlay").disabled = true; delete $("askBox").dataset.layer;
  renderAll();
}
async function createEnvelope() {
  const created = await api("envelopes", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({
    name: $("eName").value, scale: $("eScale").value, place: $("ePlace").value, parent: self() ? "" : $("eParent").value, audience: self() ? "family" : $("eAudience").value, createdBy: who() }) });
  envelopes.push(created); renderEnvSelect(); $("envSelect").value = created.id; await openEnvelope(created.id);
}
$("envSelect").addEventListener("change", (e) => { if (self() && e.target.value) $("eName").value = ""; openEnvelope(e.target.value).catch((err) => toast(err.message)); });
$("eName").addEventListener("input", () => { if (self() && $("envSelect").value) { $("envSelect").value = ""; env = null; } });
const toggleEnvForm = (open) => { if (open) $("envForm").dataset.open = "1"; else delete $("envForm").dataset.open; $("envForm").classList.toggle("hidden", !open); };
$("envNewBtn").addEventListener("click", () => toggleEnvForm(!$("envForm").dataset.open));
$("envCancel").addEventListener("click", () => toggleEnvForm(false));
$("envForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (self()) return goNext();
  if (!$("eName").value.trim()) return toast(t("needEnvelope"));
  try { await createEnvelope(); toggleEnvForm(false); $("eName").value = ""; } catch (err) { toast(err.message); }
});

// ---------- Self-entry: one step at a time
function showStep() {
  for (const n of document.querySelectorAll(".step")) n.classList.toggle("active", Number(n.dataset.step) === STEP);
  if (!self()) return;
  const names = t("stepNames");
  $("progress").classList.toggle("hidden", STEP < 1 || STEP > 5);
  if (STEP >= 1 && STEP <= 5) { $("progText").textContent = t("stepOf")(STEP, 5, names[STEP]); $("progBar").style.width = `${STEP * 20}%`; }
  const kept = drafts.filter((d) => d.keep).length;
  $("navBack").textContent = t("back"); $("navBack").classList.toggle("hidden", STEP === 0 || STEP === LAST);
  $("navAlt").textContent = t("addMore"); $("navAlt").classList.toggle("hidden", STEP !== LAST);
  $("navNext").textContent = [t("begin"), t("next"), t("next"), t("doneTelling"), t("toCheck"), kept ? t("saveAll")(kept) : t("finish"), t("nextPerson")][STEP];
  if (STEP === 3 && env && !lastQuestion) { lastQuestion = t("opening")(env.name); $("askQ").textContent = lastQuestion; $("askWhy").textContent = t("openingWhy"); $("askPlay").disabled = false; }
  if (STEP === 3 && carry) { $("transcript").value = [carry, $("transcript").value].filter(Boolean).join("\n"); carry = ""; }
  updateSay();
  $("noted").textContent = t("noted")(kept);
  $("reviewNote").textContent = drafts.length ? t("reviewNote") : t("reviewEmpty");
}
function go(n) { STEP = n; showStep(); window.scrollTo({ top: 0 }); }
async function goNext() {
  const btn = $("navNext"); if (btn.disabled) return; btn.disabled = true;
  try {
    if (STEP === 1) {
      const name = $("eName").value.trim(), picked = $("envSelect").value;
      if (name && !(env && env.name === name)) await createEnvelope();
      else if (!name && picked) { if (env?.id !== picked) await openEnvelope(picked); }
      else if (!env) return toast(t("needEnvelope"));
    }
    if (STEP === 2 && !$("sConsent").checked) return toast(t("needConsent"));
    if (STEP === 3 && $("transcript").value.trim()) { if (!(await runInterview($("transcript").value.trim(), true))) return; }
    if (STEP === 5 && drafts.some((d) => d.keep) && !(await saveDrafts())) return;
    if (STEP === LAST) return nextPerson();
    go(STEP + 1);
  } catch (err) { toast(err.message); }
  finally { btn.disabled = false; }
}
function nextPerson() { // a kiosk hands over clean: nothing of the last person stays on screen
  for (const id of ["sSpeaker", "eName", "ePlace", "transcript", "fCaption", "fDate"]) $(id).value = "";
  $("sConsent").checked = false; $("envSelect").value = ""; audio.pause();
  drafts = []; observations = []; forms = []; env = null; lastQuestion = ""; sittingStart = new Date().toISOString();
  got = {}; said = {}; carry = ""; focus = {}; parts = { 1: [], 2: [], 3: [] }; renderParts(); for (const n of [1, 2]) $(`say${n}Heard`).textContent = "";
  $("work").classList.add("hidden"); $("upState").textContent = "";
  api("envelopes").then((list) => { envelopes = list; renderEnvSelect(); }).catch(() => {});
  renderAll(); go(0);
}
$("navNext").addEventListener("click", goNext);
$("navBack").addEventListener("click", () => go(Math.max(0, STEP - 1)));
$("navAlt").addEventListener("click", () => go(3));

// ---------- Coverage of the eight layers
const current = () => observations.filter((o) => !observations.some((x) => x.supersedes === o.id));
function renderCover() {
  const box = $("cover"); box.innerHTML = ""; if (!env) { $("crumb").textContent = ""; return; }
  const obs = current(), kinds = new Set(obs.map((o) => o.kind)), strata = new Set(obs.map((o) => o.stratum));
  const cells = [
    ["form", "形", forms.length, forms.length],
    ["time", "時", strata.size, `${strata.size}/4`],
    ["actors", "人", obs.filter((o) => o.actors?.length).length, new Set(obs.flatMap((o) => o.actors || [])).size],
    ["types", "類", kinds.size, `${[...kinds].filter((k) => k !== "absence").length}/7`],
    ["evidence", "証", obs.length, obs.length],
    ["absence", "欠", obs.filter((o) => o.kind === "absence").length, obs.filter((o) => o.kind === "absence").length],
    ["protocol", "掟", 1, label(env.audience || "family")],
    ["voice", "声", obs.length >= 5 ? 1 : 0, obs.length >= 5 ? t("coverVoiceReady") : t("coverVoiceNot")],
  ];
  for (const [layer, seal, filled, text] of cells) {
    const d = el("div", filled ? "" : "empty"); d.dataset.layer = layer;
    d.append(el("span", "seal", seal), el("b", "", t("cover")[layer]), el("span", "", String(text)));
    box.append(d);
  }
  const parent = env.parent && envelopes.find((e) => e.id === env.parent);
  $("crumb").textContent = `${parent ? `${parent.name} › ` : ""}${env.name}${env.place ? ` · ${env.place}` : ""}`;
}
// Clues: the topics a full record needs, as a ready script. Ticked once something covers them.
const CLUES = [["when", "time", (o) => o.when], ["who", "actors", (o) => o.actors?.length], ["use", "types", (o) => ["use", "making", "event"].includes(o.kind)],
  ["meaning", "evidence", (o) => o.kind === "meaning"], ["passed", "protocol", (o) => o.kind === "inheritance"], ["lost", "absence", (o) => o.kind === "absence"]];
function renderClues() {
  const box = $("clues"); box.innerHTML = "";
  const have = [...(self() ? current().filter((o) => o.createdAt >= sittingStart) : current()), ...drafts.filter((d) => d.keep)];
  const rows = CLUES.map(([key, layer, test]) => ({ key, layer, done: have.some(test) }));
  for (const { key, layer, done } of [...rows.filter((r) => !r.done), ...rows.filter((r) => r.done)]) {
    const [name, question] = t("clues")[key], ask = (!self() && S[LANG].cluesIv?.[key]) || question;
    const b = el("button", done ? "clue done" : "clue full", done ? name : ask); b.type = "button"; b.dataset.layer = layer;
    b.addEventListener("click", () => showQuestion({ question: ask, layer, why: "" }));
    box.append(b);
  }
}

// ---------- Voice: speak the question, hear the answer
const audio = new Audio();
async function speak(text) {
  try {
    const r = await fetch("/api/speak", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text, figure: "narrator", lang: LANG }) });
    if (!r.ok) throw new Error("no voice");
    if (audio.src) URL.revokeObjectURL(audio.src);
    audio.src = URL.createObjectURL(await r.blob()); await audio.play();
  } catch {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = LANG === "ja" ? "ja-JP" : "en-GB"; u.rate = 0.92; speechSynthesis.speak(u);
  }
}
function showQuestion(next) {
  if (!next?.question) return;
  lastQuestion = next.question;
  $("askQ").textContent = next.question;
  $("askWhy").textContent = self() ? (next.why || "") : `${t("cover")[next.layer] || ""}${next.why ? ` · ${next.why}` : ""}`;
  $("askBox").dataset.layer = next.layer; $("askPlay").disabled = false;
  if ($("askAuto").checked) speak(next.question);
}
$("askPlay").addEventListener("click", () => lastQuestion && speak(lastQuestion));
async function runInterview(transcript, quiet) {
  $("extract").disabled = $("askNew").disabled = true; $("extractState").textContent = t("thinking");
  try {
    const d = await api("interview", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({
      envelope: env.id, lang: LANG, mode: MODE, transcript, lastQuestion, speaker: { name: $("sSpeaker").value, role: $("sRole").value } }) });
    if (transcript && !d.observations.length && !quiet) toast(t("nothingFound"));
    for (const o of d.observations) drafts.push({ ...o, keep: true, audience: o.restricted ? "family" : $("sAudience").value });
    if (d.observations.length || quiet) $("transcript").value = "";
    renderDrafts(); if (!quiet) showQuestion(d.next);
    return true;
  } catch (err) { toast(err.message); return false; }
  finally { $("extract").disabled = $("askNew").disabled = false; $("extractState").textContent = ""; }
}
$("extract").addEventListener("click", () => { const tx = $("transcript").value.trim(); if (tx || self()) runInterview(tx); });
$("askNew").addEventListener("click", () => runInterview(""));

let rec = null, tick = null;
function wireMic(mic, stateEl, idle, onText) {
  mic.addEventListener("click", async () => {
    if (rec) { rec.stop(); return; }
    audio.pause();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { stateEl.textContent = t("micBlocked"); return; }
    const type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find((m) => MediaRecorder.isTypeSupported(m)) || "";
    const r = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 48000 } : undefined);
    const chunks = []; let secs = 0;
    r.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    tick = setInterval(() => { secs++; stateEl.textContent = t("micRec")(secs); if (secs >= 300) r.stop(); }, 1000);
    r.onstop = async () => {
      clearInterval(tick); stream.getTracks().forEach((x) => x.stop()); rec = null; mic.setAttribute("aria-pressed", "false");
      stateEl.textContent = t("micBusy");
      try {
        const blob = new Blob(chunks, { type: r.mimeType || "audio/webm" });
        const res = await fetch(`/api/listen?lang=${LANG}&tidy=1`, { method: "POST", headers: { "content-type": blob.type }, body: blob });
        const d = await res.json(); if (!res.ok) throw new Error(d.error || "Could not hear that.");
        if (d.text?.trim()) { stateEl.textContent = t("sayReading"); await onText(d.text.trim()); }
      } catch (err) { toast(err.message); }
      stateEl.textContent = t(idle);
    };
    rec = r; r.start(); mic.setAttribute("aria-pressed", "true"); stateEl.textContent = t("micRec")(0);
  });
}
// Telling: in self-entry what was said is sorted straight away and the next question follows from what is still missing.
async function heard(text) {
  parts[3].push(text); renderParts();
  const box = $("transcript"); box.value = (box.value ? `${box.value.trim()}\n` : "") + text;
  if (self()) await runInterview(box.value.trim());
}
wireMic($("mic"), $("micState"), "micIdle", heard);

// ---------- Filling the first two steps by voice
const readAloud = () => $("askAuto").checked;
for (const c of document.querySelectorAll(".autoRead")) c.addEventListener("change", () => {
  for (const o of document.querySelectorAll(".autoRead")) o.checked = c.checked;
  if (!c.checked) { audio.pause(); return; }
  const now = self() && (STEP === 1 || STEP === 2) ? $(`say${STEP}Q`).textContent : lastQuestion;
  if (now) speak(now);
});
function sayMissing(step) {
  const m = [];
  if (step === 1) {
    if ($("envSelect").value && !$("eName").value.trim()) return m;
    if (!$("eName").value.trim()) m.push("name");
    if (!got.scale) m.push("scale");
    if (!$("ePlace").value.trim() && !got.place) m.push("place");
  } else {
    if (!got.role) m.push("role");
    if (!got.audience) m.push("audience");
    if (!$("sSpeaker").value.trim() && !got.name) m.push("speaker");
    if (!$("sConsent").checked) m.push("consent");
  }
  return m;
}
function sayText(step) {
  const p = t("say"), m = sayMissing(step);
  if (step === 1) {
    if (!said[1] && m.includes("name") && !got.scale) return p.start1;
    if (!m.length) return p.done1($("eName").value.trim() ? [$("eName").value.trim(), label($("eScale").value), $("ePlace").value.trim()].filter(Boolean).join(" · ") : $("envSelect").selectedOptions[0].textContent);
  } else {
    if (!said[2] && !got.role && !got.audience) return p.start2;
    if (!m.length) return p.done2;
  }
  return p[m.includes(focus[step]) ? focus[step] : m[0]];
}
function renderParts() {
  for (const n of [1, 2]) $(`say${n}Heard`).textContent = parts[n].map((x) => `“${x}”`).join(" ");
  const told = $("told"); told.classList.toggle("hidden", !parts[3].length);
  told.textContent = parts[3].length ? `${t("partsSoFar")(parts[3].length)} ${parts[3].map((x) => `“${x}”`).join(" ")}` : "";
}
function updateSay(aloud) {
  if (!self() || (STEP !== 1 && STEP !== 2)) return;
  const p = t("say"), text = sayText(STEP), q = $(`say${STEP}Q`);
  const changed = q.textContent !== text; q.textContent = text;
  $(`mic${STEP}State`).textContent = rec ? $(`mic${STEP}State`).textContent : t("sayIdle");
  // The other questions still unanswered, as a list to tap
  const left = $(`say${STEP}Left`), rest = sayMissing(STEP).filter((k) => k !== "consent" && p[k] !== text);
  left.innerHTML = ""; left.classList.toggle("hidden", !rest.length || text === p.start1 || text === p.start2);
  if (rest.length) left.append(el("span", "", t("stillLeft")));
  for (const k of rest) { const b = el("button", "", p[k]); b.type = "button"; b.addEventListener("click", () => { focus[STEP] = k; updateSay(true); }); left.append(b); }
  if (aloud && changed && readAloud()) speak(text);
}
async function intake(step, text) {
  parts[step].push(text); renderParts();
  const asked = $(`say${step}Q`).textContent, p = t("say");
  // After an open prompt anything said may fill or change a field; after a question about one thing, only what is still empty is filled.
  const open = ![p.name, p.scale, p.place, p.role, p.audience, p.speaker].includes(asked);
  said[step] = true;
  try {
    const have = { name: $("eName").value.trim(), scale: got.scale ? $("eScale").value : "", place: $("ePlace").value.trim(), speakerName: $("sSpeaker").value.trim(), role: got.role ? $("sRole").value : "", audience: got.audience ? $("sAudience").value : "" };
    const d = await api("intake", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ lang: LANG, transcript: text, asked, have }) });
    if (step === 1) {
      if (d.name && (open || !have.name)) { $("eName").value = d.name; $("envSelect").value = ""; }
      if (d.scale && (open || !have.scale)) { setVal($("eScale"), d.scale); got.scale = true; }
      if (d.place && (open || !have.place)) { $("ePlace").value = d.place; got.place = true; }
    }
    if (d.speakerName && (open || !have.speakerName)) { $("sSpeaker").value = d.speakerName; got.name = true; }
    if (d.declinedName) got.name = true;
    if (step === 2 && d.role && (open || !have.role) && [...$("sRole").options].some((o) => o.value === d.role)) { setVal($("sRole"), d.role); got.role = true; }
    if (step === 2 && d.audience && (open || !have.audience)) { setVal($("sAudience"), d.audience); got.audience = true; }
    if (d.story) carry = [carry, text].filter(Boolean).join("\n");
  } catch (err) { toast(err.message); }
  updateSay(true);
}
for (const n of [1, 2]) {
  wireMic($(`mic${n}`), $(`mic${n}State`), "sayIdle", (text) => intake(n, text));
  $(`say${n}Play`).addEventListener("click", () => speak($(`say${n}Q`).textContent));
}
if (params.has("debug")) window.gatherTest = { intake, heard }; // lets a test stand in for the microphone
// Filling a field by hand counts too, so the prompt moves on to what is still missing.
$("eScale").addEventListener("change", () => { got.scale = true; updateSay(); });
$("sRole").addEventListener("change", () => { got.role = true; updateSay(); });
$("sAudience").addEventListener("change", () => { got.audience = true; updateSay(); });
for (const id of ["eName", "ePlace", "sSpeaker", "sConsent", "envSelect"]) $(id).addEventListener("input", () => updateSay());

// ---------- Draft observations: review before anything is saved
function sel(values, value, on) { const s = el("select"); fillSelect(s, values, value); s.addEventListener("change", () => on(s.value)); return s; }
function field(text, input) { const w = el("label", "f"); w.append(el("span", "", text), input); return w; }
function chipIn(box, text, layer, solid) { const c = el("span", `chip${solid ? " solid" : ""}`, text); if (layer) c.dataset.layer = layer; box.append(c); }
function renderDrafts() {
  const box = $("drafts"); box.innerHTML = "";
  drafts.forEach((d) => {
    const card = el("div", `draft${d.kind === "absence" ? " absence" : ""}${d.keep ? "" : " off"}`);
    if (d.supersedes) card.append(el("div", "muted", t("replaces")));
    const claim = el("textarea"); claim.rows = 2; claim.value = d.claim; claim.addEventListener("input", () => { d.claim = claim.value; });
    card.append(claim);
    if (d.quote) card.append(el("div", "quote", `“${d.quote}”`));
    const chips = el("div", "chips");
    if (d.when) chipIn(chips, d.when, "time", true);
    chipIn(chips, label(d.kind), d.kind === "absence" ? "absence" : "types", true);
    for (const a of d.actors || []) chipIn(chips, a, "actors");
    card.append(chips);
    const g = el("div", "grid");
    const when = el("input"); when.value = d.when || ""; when.addEventListener("input", () => { d.when = when.value; });
    g.append(field(t("dKind"), sel(ENUMS.kind, d.kind, (v) => { d.kind = v; if (v === "absence") { d.absenceCause = d.absenceCause || "never-collected"; d.evidence = "none"; } d.open = true; renderDrafts(); })),
      field(t("dStratum"), sel(ENUMS.stratum, d.stratum, (v) => { d.stratum = v; })), field(t("dWhen"), when),
      field(t("dEvidence"), sel(ENUMS.evidence, d.evidence, (v) => { d.evidence = v; })), field(t("dRole"), sel(ENUMS.role, d.role, (v) => { d.role = v; })),
      field(t("dAudience"), sel(ENUMS.audience, d.audience, (v) => { d.audience = v; })));
    if (d.kind === "absence") {
      const note = el("input"); note.value = d.absenceNote || ""; note.addEventListener("input", () => { d.absenceNote = note.value; });
      g.append(field(t("dCause"), sel(ENUMS.cause, d.absenceCause || "never-collected", (v) => { d.absenceCause = v; })), field(t("dNote"), note));
    }
    const det = el("details"); det.open = !self() || !!d.open; det.addEventListener("toggle", () => { d.open = det.open; });
    det.append(el("summary", "", t("details")), g); card.append(det);
    const b = el("button", "quiet", d.keep ? t("drop") : t("keep")); b.type = "button"; b.addEventListener("click", () => { d.keep = !d.keep; renderDrafts(); });
    const row = el("div", "row"); row.append(b); card.append(row);
    box.append(card);
  });
  const n = drafts.filter((d) => d.keep).length;
  $("saveRow").classList.toggle("hidden", !drafts.length); $("save").textContent = t("save")(n); $("save").disabled = !n;
  $("reviewCard").classList.toggle("hidden", !self() && !drafts.length);
  renderClues(); showStep();
}
async function saveDrafts() {
  if (!$("sConsent").checked) { toast(t("needConsent")); return false; }
  if (!self() && !$("sInterviewer").value.trim()) { toast(t("needName")); return false; }
  const items = drafts.filter((d) => d.keep);
  try {
    const r = await api("observations", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({
      session: { envelope: env.id, mode: MODE, interviewer: $("sInterviewer").value, speaker: $("sSpeaker").value, grantedBy: self() ? "" : $("sGranted").value, audience: $("sAudience").value, consent: true, lang: LANG },
      items }) });
    toast(t("saved")(r.saved)); drafts = [];
    const d = await api(`envelope?id=${encodeURIComponent(env.id)}`); observations = d.observations; forms = d.forms; renderAll();
    return true;
  } catch (err) { toast(err.message); return false; }
}
$("save").addEventListener("click", saveDrafts);

// ---------- The record. In self-entry a person sees only what they saved in this sitting.
const STRATA = ["made", "lived", "observed", "present"];
function renderRecord() {
  const box = $("record"); box.innerHTML = "";
  const obs = current().filter((o) => !self() || o.createdAt >= sittingStart);
  if (!obs.length) { box.append(el("div", "muted", t("emptyRecord"))); return; }
  for (const st of STRATA) {
    const items = obs.filter((o) => o.stratum === st).sort((a, b) => (a.kind === "absence") - (b.kind === "absence"));
    if (!items.length) continue;
    box.append(el("div", "stratum", label(st)));
    for (const o of items) {
      const c = el("div", `obs${o.kind === "absence" ? " absence" : ""}`);
      c.append(el("div", "", `${o.kind === "absence" ? `${t("unknown")}: ` : ""}${o.claim}`));
      if (o.absence?.note) c.append(el("div", "muted", `${label(o.absence.cause)} — ${o.absence.note}`));
      if (o.quote) c.append(el("div", "quote", `“${o.quote}”`));
      const chips = el("div", "chips");
      if (o.when) chipIn(chips, o.when, "time", true);
      chipIn(chips, label(o.kind), o.kind === "absence" ? "absence" : "types", true);
      chipIn(chips, label(o.evidence), "evidence"); chipIn(chips, label(o.standing.role), "evidence", true);
      for (const a of o.actors || []) chipIn(chips, a, "actors");
      chipIn(chips, selfLabel(o.protocol.audience), "protocol", true);
      c.append(chips);
      if (!self()) c.append(el("div", "muted", `${t("by")} ${o.speaker} · ${o.createdAt.slice(0, 10)} · ${o.author}`));
      const row = el("div", "row");
      const fix = el("button", "link", t("correct")); fix.type = "button";
      fix.addEventListener("click", () => { drafts.push({ claim: o.claim, quote: o.quote, kind: o.kind, stratum: o.stratum, when: o.when, evidence: o.evidence, role: o.standing.role, actors: o.actors, absenceCause: o.absence?.cause, absenceNote: o.absence?.note, audience: o.protocol.audience, supersedes: o.id, keep: true }); renderDrafts(); if (self()) go(5); else $("drafts").scrollIntoView({ behavior: "smooth", block: "center" }); });
      row.append(fix);
      let n = 0; for (let p = o; p?.supersedes; p = observations.find((x) => x.id === p.supersedes)) n++;
      if (n) row.append(el("span", "muted", t("earlier")(n)));
      c.append(row); box.append(c);
    }
  }
}

// ---------- Form: uploads, each with its reality basis
const TILES = [["photo", "tPhoto", "tPhotoSub", "image/*", true], ["splat", "tSplat", "tSplatSub", ".sog,.spz,.ply,.splat,.ksplat", false], ["scan", "tScan", "tScanSub", ".glb,.obj,.stl,.ply", false], ["reconstruction", "tSynth", "tSynthSub", ".glb,.obj,.stl", false]];
function renderTiles() {
  const box = $("tiles"); box.innerHTML = "";
  for (const [kind, name, sub, accept, multiple] of TILES) {
    const tile = el("label", "tile");
    const basis = ENUMS.basis[kind];
    const input = el("input"); input.type = "file"; input.accept = accept; input.multiple = multiple;
    input.addEventListener("change", () => { uploadFiles(kind, [...input.files]); input.value = ""; });
    tile.append(el("b", "", t(name)), el("small", "", t(sub)), el("span", `basis ${basis}`, t(basis)), input);
    box.append(tile);
  }
}
// Photos are resized to 2048 px JPEG in the browser, which also drops location and camera data.
async function shrink(file) {
  if (!file.type.startsWith("image/")) return file;
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
    const c = Object.assign(document.createElement("canvas"), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.86));
    return new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch { return file; }
}
async function uploadFiles(kind, files) {
  for (const raw of files) {
    const file = kind === "photo" ? await shrink(raw) : raw;
    $("upState").textContent = t("uploading")(file.name);
    const q = new URLSearchParams({ envelope: env.id, kind, name: file.name, caption: $("fCaption").value, date: $("fDate").value, by: who(), audience: $("sAudience").value });
    try { forms.push(await api(`upload?${q}`, { method: "PUT", headers: { "content-type": file.type || "application/octet-stream" }, body: file })); $("upState").textContent = t("uploaded"); }
    catch (err) { $("upState").textContent = err.message; }
    renderForms(); renderCover();
  }
}
function renderForms() {
  const box = $("forms"); box.innerHTML = "";
  for (const f of forms.filter((x) => !self() || x.createdAt >= sittingStart)) {
    const d = el("div", "formitem");
    if (f.kind === "photo") { const img = el("img"); img.src = `/api/gather/file/${f.file}`; img.alt = f.caption || f.name; img.loading = "lazy"; d.append(img); }
    d.append(el("b", "", t({ splat: "tSplat", photo: "tPhoto", scan: "tScan", reconstruction: "tSynth" }[f.kind])), el("span", `basis ${f.basis}`, t(f.basis)));
    if (f.caption) d.append(el("span", "", f.caption));
    d.append(el("span", "muted", [f.captured?.date, f.captured?.by, `${(f.size / 1048576).toFixed(1)} MB`].filter(Boolean).join(" · ")));
    box.append(d);
  }
}
function renderAll() { renderCover(); renderDrafts(); renderRecord(); renderForms(); }

// ---------- Go
remember("sInterviewer"); // the speaker's name is not kept in the browser
$("askAuto").checked = !self();
[ENUMS, envelopes] = await Promise.all([api("enums"), api("envelopes")]);
applyLang();
const last = stored("gather.env");
if (!self() && last && envelopes.some((e) => e.id === last)) { $("envSelect").value = last; openEnvelope(last).catch(() => {}); }
</script>
